# slam_toolbox parameters for TurtleBot4 indoor mapping.
#
# These are passed to the online-async node launched by
# deployment/src/slam/slam.launch.py. Defaults tuned for a TB4 Create 3 base
# with a 2D RPLidar, driving slowly (≤ 0.2 m/s) in indoor rooms/corridors.
#
# Input topics (post tb4_bridge): /scan, /tf, /tf_static, /odom
# Output: /map (occupancy grid) + map → odom TF
#
# Tweak minimum_travel_distance / minimum_travel_heading to make the map
# update more/less aggressively. Lower values → denser node graph but more CPU.

slam_toolbox:
  ros__parameters:
    # ── Frames ────────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame:  map
    base_frame: base_link      # TurtleBot4 Create 3 publishes TF rooted at base_link
    scan_topic: /scan

    # ── Mode ──────────────────────────────────────────────────────────────
    mode: mapping                 # "mapping" or "localization"
    use_sim_time: false

    # ── Solver / loop closure ─────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Map resolution ────────────────────────────────────────────────────
    resolution: 0.05              # m/cell — 5 cm grid
    map_update_interval: 2.0      # s between /map publishes
    transform_publish_period: 0.05
    map_publish_period: 2.0

    # ── Scan matching ─────────────────────────────────────────────────────
    max_laser_range: 12.0         # RPLidar A1 range cap
    minimum_time_interval: 0.2    # s between processed scans
    transform_timeout: 0.2

    # ── Node-graph density (tune for speed vs detail) ─────────────────────
    minimum_travel_distance: 0.10 # m — add node every 10 cm moved
    minimum_travel_heading: 0.15  # rad — or every ~8.6°
    stack_size_to_use: 40000000

    # ── Loop-closure search ───────────────────────────────────────────────
    enable_interactive_mode: false
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation search (coarse and fine) ──────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan matcher penalties ────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
